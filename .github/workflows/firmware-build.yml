name: ESP-IDF firmware target build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-C3 firmware with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c3
          path: firmware
      - name: Confirm factory binary exists
        run: test -s firmware/build/offgrid_messenger_lora.bin
      - name: Upload firmware CI binaries (not field qualified)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-ci-not-field-qualified
          path: |
            firmware/build/offgrid_messenger_lora.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
