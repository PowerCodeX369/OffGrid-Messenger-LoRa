name: Android source build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36 platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native Android debug APK (no release keys)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm Android APK was created
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for developer evaluation (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-ci-not-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
